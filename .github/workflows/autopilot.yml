# Scheduled autopilot: processes every URL in trending.txt and (optionally) posts.
#
# To activate:
#   1. Add repo secrets: ANTHROPIC_API_KEY, REPLICATE_API_TOKEN, and the tokens
#      for whichever platforms you post to.
#   2. Commit a trending.txt at the repo root with one reel URL per line.
#   3. Uncomment the `schedule:` block below.
#
# By default this runs WITHOUT --auto-approve, so it only renders drafts
# (visible as workflow artifacts). Add --auto-approve --post-to ... once you
# trust the output enough to publish unreviewed.

name: autopilot

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 14 * * *"   # daily at 14:00 UTC

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore job history
        uses: actions/cache@v4
        with:
          path: data
          key: reeltoon-data-${{ github.run_id }}
          restore-keys: reeltoon-data-

      - name: Run autopilot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: python -m reeltoon autopilot --urls-file trending.txt

      - name: Upload rendered drafts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-reels
          path: data/jobs/*/final.mp4
          if-no-files-found: ignore
