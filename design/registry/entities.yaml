# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: battle_length_budget
    status: active
    source: design/gdd/time-authority-mode-switch.md
    referenced_by:
      - design/gdd/time-authority-mode-switch.md
    value: "8-15 target, 20 ceiling"
    unit: minutes
    notes: "CD-9's single-sitting budget, measured freeze-to-dial-regained. Owned by Time Authority
      as the boundary budget; the Combat set (#19-23) owns ACHIEVING it via its own pacing levers
      (incl. the C3-mandated combat pacing control) and carries the primary playtest criterion.
      Raising the ceiling weakens the no-mid-battle-save justification. Will be referenced_by the
      combat-set GDDs."
    added: 2026-08-02
    revised: ""

  - name: material_tier_ordering
    status: active
    source: design/quick-specs/material-catalog.md
    referenced_by:
      - design/quick-specs/material-catalog.md
      - design/gdd/terrain-data-model.md
      - design/gdd/game-concept.md
    value: "Dirt(0) < Granite(1) < Reinforced(2)"
    unit: tier_ordinal
    notes: "A Pillar 3 (Scars Teach) requirement, not a tuning convention. The terrain GDD
      handed this cross-check to Material Catalog with an explicit warning that it was split
      across two owners with nobody checking direction. Enforced at catalog LOAD: max_wall_hp,
      dig_cost and value must be STRICTLY increasing by tier and build_cost non-decreasing, or
      the catalog fails to load naming the offending material and field. Never a warning, never
      a clamp, never a silent reorder. If a rebalance inverted the ordering the game would not
      be mistuned - it would teach the player something false, and CD-1's after-action report
      would become an active lie."
    added: 2026-08-24
    revised: ""

