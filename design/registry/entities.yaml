#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items:
  # The three MVP material tiers. One stable key space spans BOTH terrain wall/floor
  # types AND item stacks (ADR-0003 SpawnStack(material, ...) and the save/load spike's
  # "item stacks by stable material key") - so these entries are the canonical identity
  # for a material wherever it appears: in a cell, in a stack, or in a save manifest.
  # Numbers below are FIRST-PASS PLACEHOLDERS pending /balance-check.
  - name: dirt
    status: active
    source: design/quick-specs/material-catalog.md
    referenced_by:
      - design/quick-specs/material-catalog.md
      - design/gdd/terrain-data-model.md
      - design/gdd/game-concept.md
    category: construction_material
    stackable: true
    tier: 0
    tier_name: Dirt
    max_wall_hp: 100
    dig_cost: 40
    build_cost: 1
    yield_qty: 1
    value: 1
    naturally_occurring: true
    added: 2026-08-24
    revised: ""

  - name: granite
    status: active
    source: design/quick-specs/material-catalog.md
    referenced_by:
      - design/quick-specs/material-catalog.md
      - design/gdd/terrain-data-model.md
      - design/gdd/game-concept.md
    category: construction_material
    stackable: true
    tier: 1
    tier_name: Granite
    max_wall_hp: 300
    dig_cost: 120
    build_cost: 2
    yield_qty: 1
    value: 3
    naturally_occurring: true
    added: 2026-08-24
    revised: ""

  - name: reinforced
    status: active
    source: design/quick-specs/material-catalog.md
    referenced_by:
      - design/quick-specs/material-catalog.md
      - design/gdd/terrain-data-model.md
      - design/gdd/game-concept.md
    category: construction_material
    stackable: true
    tier: 2
    tier_name: Reinforced
    max_wall_hp: 800
    dig_cost: 320
    build_cost: 4
    yield_qty: 1
    value: 8
    naturally_occurring: "UNRESOLVED"
    notes: "OPEN QUESTION (material-catalog quick-spec §8 item 1): the concept doc supports
      both readings - Pillar 5's 'deeper strata hold richer materials' implies mined, while
      'construction tech scales from dirt to reinforced stone to engineered defenses' implies
