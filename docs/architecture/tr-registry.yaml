    status: active
  - id: TR-time-043
    system: time
    gdd: design/gdd/time-authority-mode-switch.md
    requirement: "Performance budgets (CI gates): dispatch <=0.70 us/sub-step; RealTime->TurnBased swap <=0.40 us; PostEncounterReconcile <=35 us reference with near-linear scaling (4x ratio <=6, raider-axis <=8x)."
    created: 2026-08-08
    status: active
  - id: TR-time-044
    system: time
    gdd: design/gdd/time-authority-mode-switch.md
    requirement: "Zero steady-state allocation: dispatch <=0.05 B/sub-step and Gen0==0 over >=20,000 sub-steps; reconcile Gen0==0 per pass; MutationWindow.Open() must be a readonly struct scope (never a boxing IDisposable class)."
