    status: active
  - id: TR-time-042
    system: time
    gdd: design/gdd/time-authority-mode-switch.md
    requirement: "Simulation update flows only through ITickable.Tick() driven by the active authority; _Process is presentation-only and keeps running after Tick() stops; no sim logic in _Process/_PhysicsProcess."
