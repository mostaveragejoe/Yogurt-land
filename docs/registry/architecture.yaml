# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-08-25"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: rng_streams
    status: active
    owner_system: seeded-rng
    adr: docs/architecture/adr-0005-seeded-rng.md
    interface: "SeededRngStore — granted per-system mode-tagged draw handles (NextInt/NextDouble per RngStream); RootSeed injected at the composition root; SnapshotInto/Restore by RngStreamGroup"
    write_access: seeded-rng-only   # a draw is a write to SeededRngStore; only granted handles draw
    referenced_by:
      - docs/architecture/adr-0005-seeded-rng.md
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md   # checkpoints the combat-transient group's State
    added: 2026-08-08
    revised: ""

# Example:
#
# state_ownership:
#   - state: player_health
#     status: active           # active | superseded_by: ADR-NNNN
#     owner_system: health-system
#     adr: docs/architecture/adr-0001-health-system.md
#     interface: "HealthComponent.current_health (read-only float, range 0–max_health)"
#     write_access: health-system-only   # only owner can write; others read
#     referenced_by:
#       - docs/architecture/adr-0001-health-system.md
#       - docs/architecture/adr-0003-combat-system.md   # reads to apply damage
#       - docs/architecture/adr-0007-ui-system.md       # reads to display HUD
#     added: 2026-03-26
#     revised: ""


# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: rng_draw
    status: active
    pattern: direct_call     # granted, mode-tagged stream handle; no signal/bus for RNG
    producer: seeded-rng
    consumers:
      - combat            # draws RngStream.Combat (asserts Mode==TurnBased)
      - raid-trigger      # draws RngStream.RaidSchedule (asserts Mode==RealTime)
      - needs-simulation  # draws RngStream.NeedsJitter (asserts Mode==RealTime)
    adr: docs/architecture/adr-0005-seeded-rng.md
    signal_signature: "SeededRngStore.NextInt(RngStream, int maxExclusive) / NextDouble(RngStream); combat group via SnapshotInto(IBufferWriter<byte>, RngStreamGroup) into ADR-0004's pooled buffer at the AwaitingPresentation->NextActor beat"
    referenced_by:
      - docs/architecture/adr-0005-seeded-rng.md
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md
    added: 2026-08-08
    revised: ""

  - contract: terrain_change_notification
    status: active
    pattern: event_bus      # push dispatch; deliberately NOT the Revision-polling used for entities
    producer: terrain-data-model      # TerrainWorld is the bus's ONLY publisher, permanently
    consumers:
      - pathfinding                 # priority 10 — marks its layer stale
      - spatial-query-los           # priority 20
      - job-assignment              # priority 30
      - repair-rebuild              # priority 40
      - notifications               # priority 50
      - terrain-rendering-cutaway   # priority 60 — Godot-side; unsubscribes in _ExitTree
    adr: docs/architecture/adr-0006-world-change-event-bus-subscriber-contract.md
    signal_signature: "ITerrainChangeSubscriber.OnTerrainChanged(in TerrainChangeBatch) / OnWorldReloaded(); registration via WorldChangeEventBus.Subscribe(subscriber, int priority) at the composition root, dispatched in (priority, registration sequence) order"
    notes: "NOT a C# event. TerrainChangeBatch is a ref struct and cannot be a generic type
      argument on C# 12 (net8.0) — and would remain illegal on .NET 9, since allows ref struct
      is opt-in per declaration and List<T> can never qualify by CLR rule. Ordering is
      deterministic but NOT load-bearing: rule 12 forbids a handler reading another
      subscriber's derived state during dispatch. All subscribers must register BEFORE
      TerrainWorld is constructed, or they miss the load-window WorldReloaded."
    referenced_by:
      - docs/architecture/adr-0006-world-change-event-bus-subscriber-contract.md
      - docs/architecture/adr-0002-terrain-data-model.md   # owns the batch + the sink
    added: 2026-08-25
    revised: ""

