# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: simulation_tick
    status: active
    pattern: direct_call
    producer: time-authority   # the active authority dispatches
    consumers:
      - all-simulation-systems   # registered via Register(system, authority, phase, priority)
    adr: docs/architecture/adr-0001-time-authority-mode-switch.md
    signal_signature: "ITickable.Tick(TimeContext) — deterministic (TickPhase, priority, registration) order; the ONLY sanctioned simulation-update path; _Process is presentation-only"
    referenced_by:
      - docs/architecture/adr-0001-time-authority-mode-switch.md
      - docs/architecture/adr-0002-terrain-data-model.md
      - docs/architecture/adr-0003-entity-data-ownership.md
    added: 2026-08-07
    revised: ""

  - contract: mode_switch_request
    status: active
    pattern: direct_call
    producer: raid-trigger   # sole requester of the switch IN; the Combat set is the sole requester of the switch back
    consumers:
      - time-authority   # RequestSwitch(target, SwitchTransitionData) -> SwitchResult; rejects, never queues
    adr: docs/architecture/adr-0001-time-authority-mode-switch.md
    signal_signature: "SwitchTransitionData carries encounter FRAMING only (EncounterId, TriggerReason, BreachCells, ParticipantIds) — never entity state; checkpoint restore must NOT route through RequestSwitch (ADR-0004)"
    referenced_by:
      - docs/architecture/adr-0001-time-authority-mode-switch.md
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md
    added: 2026-08-07
    revised: ""

  - contract: mode_transition_notification
    status: active
    pattern: signal   # direct manager event with declared handler order — NOT on the World Change Event Bus
    producer: time-authority
    consumers:
      - combat-ui        # receives encounter context before the camera reframes
      - view-layer       # view-freeze contract: hold self-driven animation on RealTime->TurnBased, resume on return
      - simulation-systems-as-needed
    adr: docs/architecture/adr-0001-time-authority-mode-switch.md
    signal_signature: "ModeTransitioned(ModeTransition) — ordered handlers; fires with reason RestoredFromCheckpoint on checkpoint load (ADR-0004)"
    referenced_by:
      - docs/architecture/adr-0001-time-authority-mode-switch.md
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md
    added: 2026-08-07
    revised: ""

  - contract: terrain_change_events
    status: active
    pattern: event_bus   # the World Change Event Bus — a dumb synchronous dispatcher; no queueing, no replay
    producer: terrain-data-model   # Terrain is the bus's ONE publisher, ever
    consumers:
      - pathfinding        # invalidate regions/paths
      - job-assignment     # flag jobs on changed cells
      - terrain-rendering  # dirty ChunkOf(cell)
    adr: docs/architecture/adr-0002-terrain-data-model.md
    signal_signature: "Publish(in TerrainChangeBatch) — ref struct, valid only during the call, Previous state included; PublishWorldReloaded() for non-incremental population; ALL handlers are idempotent bookkeeping only"
    referenced_by:
      - docs/architecture/adr-0002-terrain-data-model.md
      - docs/architecture/adr-0001-time-authority-mode-switch.md
    added: 2026-08-07
    revised: ""

  - contract: entity_change_notification
    status: active
    pattern: shared_resource   # Revision polling — deliberately NO entity event bus
    producer: entity-layer   # every store + UnitOccupancyIndex exposes a monotonic Revision
    consumers:
      - pathfinding   # polls per dispatch
      - views         # poll per frame, diff for spawn/despawn
    adr: docs/architecture/adr-0003-entity-data-ownership.md
    signal_signature: "long Revision (+1 per mutating call, +1 on Restore; runtime-only, never serialized); consumers rescan what they cache; upgrade trigger: ~5x growth in colonists/path length/dig rate"
    referenced_by:
      - docs/architecture/adr-0003-entity-data-ownership.md
    added: 2026-08-07
    revised: ""

  - contract: encounter_outcome_delivery
    status: active
    pattern: shared_resource   # one-slot inbox — breaks the Combat <-> Veterancy cycle
    producer: combat-turn-order   # writes exactly once per encounter at battle end
    consumers:
      - identity-bookkeeping   # BattlesSurvived++ for survivors (MVP)
      - notifications          # named death + death cell, CD-4 (MVP)
      - veterancy              # sole writer of skill fields (VS)
    adr: docs/architecture/adr-0003-entity-data-ownership.md
    signal_signature: "EncounterOutcomeReport {EncounterId, ParticipantIds, per-participant outcome, raid result} via EncounterOutcomeInbox; drained by PostEncounterReconcile under ADR-0001 phase/priority ordering; never serialized (provably empty at every checkpoint — ADR-0004)"
    referenced_by:
      - docs/architecture/adr-0003-entity-data-ownership.md
      - docs/architecture/adr-0001-time-authority-mode-switch.md
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md
    added: 2026-08-07
    revised: ""

  - contract: presentation_gating
    status: active
    pattern: shared_resource   # plain-C# interface satisfied by the view layer; stubbed in headless tests
    producer: view-layer
    consumers:
      - time-authority   # TurnBasedAuthority gates turn advancement on IsComplete
    adr: docs/architecture/adr-0001-time-authority-mode-switch.md
    signal_signature: "IPresentationGate.IsComplete — no Godot type ever enters the authority; paces combat-interior turn advancement only (distinct from ModeTransitioned)"
    referenced_by:
      - docs/architecture/adr-0001-time-authority-mode-switch.md
    added: 2026-08-07
    revised: ""

  - contract: rng_stream_grants
    status: active
    pattern: direct_call   # per-stream references handed out at the composition root — same segregation as ADR-0003's entity-store writer interfaces
    producer: composition-root   # RngSeeder.DerivePersistent at world creation; RngSeeder.DeriveEncounterScoped inside the authority-driven Reaction-phase seam at switch-in (streams allocated once, Restore()d in place per encounter — zero allocation per battle)
    consumers:
      - raid-trigger                     # RaidTrigger stream
      - map-authoring                    # ColonistIdentity embark draw (#14); MapGeneration (post-MVP #35)
      - combat-targeting-resolution      # CombatResolution stream (TurnBased only)
      - combat-raider-decision-making    # CombatRaiderAi stream (TurnBased only)
    adr: docs/architecture/adr-0005-seeded-rng-determinism.md
    signal_signature: "Each system receives ONLY its own named stream(s) per the ADR-0005 ownership table — holding an unowned stream is unrepresentable; RngStreamId enum values are explicit and NEVER renumbered (they participate in derivation); on RestoredFromCheckpoint the streams are Restore()d by ADR-0004's sanctioned restore writer, never re-derived; PresentationRng is the sole sanctioned non-sim generator"
    referenced_by:
      - docs/architecture/adr-0005-seeded-rng-determinism.md
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md
    added: 2026-08-07
    revised: ""

  - contract: checkpoint_snapshot_into
    status: active
    pattern: direct_call   # caller-buffer obligation on ADR-0002/0003 stores — a contract obligation, not an aspiration
    producer: battle-checkpoint-writer
    consumers:
      - terrain-data-model   # TerrainWorld gains a SnapshotInto(IBufferWriter<byte>)-style overload
      - entity-layer         # stores + side-table owners likewise
    adr: docs/architecture/adr-0004-battle-checkpoint-architecture.md
    signal_signature: "SnapshotInto(caller buffer) for the per-activation checkpoint path (double-buffered pooled buffers, ~0.6 ms on the sim thread); the allocating Snapshot() remains the colony-save path only — calling it per activation re-creates the 2 MB/activation LOH regression"
    referenced_by:
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md
      - docs/architecture/adr-0002-terrain-data-model.md
      - docs/architecture/adr-0003-entity-data-ownership.md
    added: 2026-08-07
    revised: ""

