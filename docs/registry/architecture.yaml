# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: stock_or_engine_rng_in_core
    status: active
    description: "No System.Random, Godot RandomNumberGenerator, Guid.NewGuid, or time-based
      seeding anywhere in src/core. All randomness goes through SeededRngStore (PCG-XSH-RR).
      RootSeed is injected from the Godot composition root as a plain value."
    why: "System.Random's algorithm is not a stable cross-version contract, so it cannot back
      a save format; Godot RandomNumberGenerator is a Godot dependency banned in the core;
      entropy sources are non-deterministic and break bit-reproducible resume (AC-67 / TR-time-026)."
    adr: docs/architecture/adr-0005-seeded-rng.md
    added: 2026-08-08

  - pattern: generic_over_terrain_change_batch
    status: active
    description: "Never use TerrainChangeBatch as a generic type argument: event Action<T>,
      EventHandler<T>, IObserver<T>, List<Action<T>>. Use ITerrainChangeSubscriber."
    why: "It is a ref struct, which C# 12 (net8.0) forbids as a generic type argument — a
      compile error, not a slowdown. This does NOT lift on .NET 9: allows ref struct is opt-in
      per declaration and the BCL has not annotated those types, while List<T> can never
      qualify because the CLR forbids arrays of ByRefLike element type. The natural workaround
      for the compile error (copy changes into a List first) allocates on every dig and breaks
      the zero-steady-state-allocation standard."
    adr: docs/architecture/adr-0006-world-change-event-bus-subscriber-contract.md
    added: 2026-08-25

  - pattern: bus_registration_during_dispatch
    status: active
    description: "Never call Subscribe/Unsubscribe while Publish is on the stack. The
      IsInstanceValid purge of a dead Godot subscriber is DEFERRED — mark and skip during the
      walk, compact after it returns."
    why: "The sorted subscriber list is not re-entrantly safe, and Publish walks a plain array
      whose indices removal would invalidate. Dispatch order would also depend on dispatch
      position, breaking the determinism ADR-0002 rule 8 requires."
    adr: docs/architecture/adr-0006-world-change-event-bus-subscriber-contract.md
    added: 2026-08-25

  - pattern: cross_subscriber_read_during_dispatch
    status: active
    description: "A bus handler must not query another subscriber's derived state during
      dispatch (e.g. Job Assignment calling IsReachable inside its handler). Handlers mark
      their OWN state stale; cross-system reads happen in Tick(), after dispatch completes."
    why: "Handlers only mark rather than recompute, so such a query returns a different answer
      depending on whether the earlier handler has run — a genuine read-after-invalidate that
      the idempotence rule does not cover, because querying is not writing. This rule is what
      makes 'dispatch order is not load-bearing' true by construction rather than by hope."
    adr: docs/architecture/adr-0006-world-change-event-bus-subscriber-contract.md
    added: 2026-08-25

