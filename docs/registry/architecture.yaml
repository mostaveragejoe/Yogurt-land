# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-08-07"
# Backfilled 2026-08-07 (user approval) from ADR-0001, ADR-0002, ADR-0003, ADR-0004.
# ADR-0005 entries added + rng_outside_authority_execution revised 2026-08-07 (user approval).
# `added` is the registry-entry date; decision dates and full rationale live in the ADRs.

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: time_authority_mode
    status: active
    owner_system: time-authority
    adr: docs/architecture/adr-0001-time-authority-mode-switch.md
    interface: "TimeContext {Mode, DeltaSeconds, TurnIndex, TickSequence} passed by value into every Tick(); TimeAuthorityManager.CurrentMode / SwitchPending / PendingSwitchTarget read-only; Snapshot()/Restore() for saves"
    write_access: time-authority-manager-only   # mode changes via RequestSwitch; the checkpoint restore path (ADR-0004) is the one sanctioned non-RequestSwitch entry into TurnBased
    referenced_by:
      - docs/architecture/adr-0001-time-authority-mode-switch.md
      - docs/architecture/adr-0003-entity-data-ownership.md    # mode assertions on writers
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md
    added: 2026-08-07
    revised: ""

  - state: terrain_cells
    status: active
    owner_system: terrain-data-model
    adr: docs/architecture/adr-0002-terrain-data-model.md
    interface: "TerrainWorld facade — GetCell/GetChunkCells reads (copies/read-only spans only); writes via the facade write methods inside the mutation window; one TerrainChangeBatch published per mutating call; Revision for O(1) change detection"
    write_access: per-authority-writer-set   # RealTime: Excavation, Construction, Repair & Rebuild; TurnBased: Combat Targeting & Resolution only; load window: Map Authoring / Restore (ADR-0002 rule 4)
    referenced_by:
      - docs/architecture/adr-0002-terrain-data-model.md
      - docs/architecture/adr-0001-time-authority-mode-switch.md   # mutation window provider
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md   # checkpoint carries full grid
    added: 2026-08-07
    revised: ""

  - state: entity_store_field_groups
    status: active
    owner_system: entity-layer   # ColonistStore, RaiderStore, ItemStore, DoorStore
    adr: docs/architecture/adr-0003-entity-data-ownership.md
    interface: "Typed plain-C# stores keyed by EntityId; read access for everyone; writes only through per-(system x field group) writer interfaces granted at the composition root; ADR-0003's write-ownership table is the single authority on grants"
    write_access: ownership-table-only   # every write debug-asserts mutation window + active mode (where authority-split) + id kind
    referenced_by:
      - docs/architecture/adr-0003-entity-data-ownership.md
      - docs/architecture/adr-0001-time-authority-mode-switch.md   # reconcile duties
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md   # checkpoint restore = distinct sanctioned writer
    added: 2026-08-07
    revised: ""

  - state: unit_health
    status: active
    owner_system: writer-per-authority   # Needs & Simulation under RealTime; Combat Targeting & Resolution under TurnBased
    adr: docs/architecture/adr-0003-entity-data-ownership.md
    interface: "Authority-tagged health writer interfaces; store debug-asserts active mode; Hp reaching 0 sets IsDead in the same lethal write (no separate death writer); the store internally releases dead units from occupancy"
    write_access: one-writer-per-mode   # the decided Combat-vs-Needs arbitration; neither system ever calls the other
    referenced_by:
      - docs/architecture/adr-0003-entity-data-ownership.md
      - docs/architecture/adr-0001-time-authority-mode-switch.md   # mode exclusivity makes it sound
    added: 2026-08-07
    revised: ""

  - state: unit_occupancy
    status: active
    owner_system: entity-layer   # UnitOccupancyIndex — derived bookkeeping, never serialized
    adr: docs/architecture/adr-0003-entity-data-ownership.md
    interface: "CellCoord -> living unit EntityId(s); multi-occupant results in ascending EntityId order; exclusive under TurnBased (hard invariant), advisory under RealTime; rebuilt from stores on load (dead units filtered — ADR-0004)"
    write_access: store-internal-only   # only the unit stores' position/death handling updates it, atomically with the store write
    referenced_by:
      - docs/architecture/adr-0003-entity-data-ownership.md
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md
    added: 2026-08-07
    revised: ""

  - state: stack_reservations
    status: active
    owner_system: stockpile-and-hauling   # StackReservationTable — sparse side table
    adr: docs/architecture/adr-0003-entity-data-ownership.md
    interface: "Stack id -> reserving job + reserved qty; gates ItemStore.ConsumeFromStack (consume requires a live reservation); owner exposes ReleaseAllHeldBy(EntityId) for PostEncounterReconcile"
    write_access: stockpile-and-hauling-only   # never an ItemStore field, never terrain's Flags bit
    referenced_by:
      - docs/architecture/adr-0003-entity-data-ownership.md
      - docs/architecture/adr-0002-terrain-data-model.md   # firewall pre-assignment
    added: 2026-08-07
    revised: ""

  - state: combat_transient_state
    status: active
    owner_system: combat-systems   # encounter-scoped side tables: Turn Order (initiative/order), Action Economy (AP), Targeting (locks/overwatch)
    adr: docs/architecture/adr-0003-entity-data-ownership.md
    interface: "Encounter-scoped side tables keyed by EntityId, created at switch-in, discarded at battle end; checkpoint-grade Snapshot()/Restore() on the owners, invoked by the checkpoint writer only (Amendment 2026-08-03)"
    write_access: owning-combat-system-only   # never a store field; never in a colony-mode save; serialized only into the battle checkpoint by its owners
    referenced_by:
      - docs/architecture/adr-0003-entity-data-ownership.md
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md
    added: 2026-08-07
    revised: ""

  - state: rng_streams
    status: active
    owner_system: per-stream-owner   # ADR-0005 ownership table: RaidTrigger -> Raid Trigger #18; ColonistIdentity -> Map Authoring embark path #14 (Colonist Entity #9 is a passive store, never draws); MapGeneration -> Map Authoring/procgen #35 (post-MVP); CombatResolution -> Combat Targeting & Resolution #22; CombatRaiderAi -> Combat Raider Decision-Making #23
    adr: docs/architecture/adr-0005-seeded-rng-determinism.md
    interface: "RngStream (PCG32 XSH-RR; NextUInt32/NextUInt64/NextInt/NextFloat01/NextBool; Snapshot()/Restore() of the 16-byte PcgState, NAMED fields only — never struct memcpy); persistent streams serialized in colony saves; encounter-scoped streams (CombatResolution, CombatRaiderAi) in battle checkpoints ONLY, each snapshotted by its owning combat system; MasterSeed serialized in the colony save, EncounterIdSource by Time Authority in both save kinds"
    write_access: sole-drawer-per-stream   # the ownership table's "Drawn under" authority column is assertable; every Next* debug-asserts the mutation window (Tick / authority-driven resolution / load window); restore never re-derives
    referenced_by:
      - docs/architecture/adr-0005-seeded-rng-determinism.md
      - docs/architecture/adr-0001-time-authority-mode-switch.md   # draw-legality rule; EncounterId allocation
      - docs/architecture/adr-0003-entity-data-ownership.md        # AppearanceSeed draw; EntityIdSource precedent; combat-transient firewall
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md   # content item 3 — checkpoint carries the combat stream states
    added: 2026-08-07
    revised: ""

  - state: battle_checkpoint_slot
    status: active
    owner_system: battle-checkpoint-writer
    adr: docs/architecture/adr-0004-battle-checkpoint-architecture.md
    interface: "Single rolling non-selectable slot; full self-contained save tagged Mode == TurnBased with a writer-id header; one snapshot per resolved activation at the AwaitingPresentation -> NextActor beat, plus activation 0 post-swap; disk converges to newest (coalesce-newest)"
    write_access: checkpoint-writer-only   # the sole legal author of a combat-mode save; write-side refusal of any other writer is AC-68's mechanism
    referenced_by:
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md
      - docs/architecture/adr-0001-time-authority-mode-switch.md
    added: 2026-08-07
    revised: ""

