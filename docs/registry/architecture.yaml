# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - target_fps: 60
    total_frame_budget_ms: 16.6
    platform: PC
    adr: docs/architecture/adr-0001-time-authority-mode-switch.md   # stated as a constraint; canonical numbers live in .claude/docs/technical-preferences.md
    added: 2026-08-07
    revised: ""

  - system: terrain-rendering
    status: active
    budget_ms: 0
    adr: docs/architecture/adr-0002-terrain-data-model.md
    notes: "Draw-call budget, not ms: <= 150 terrain draw calls for the visible 3-layer cutaway (measured 32 at octant 32, one style per tier); ~8 style variants per tier is the variety ceiling; provisional 500 draw-call whole-frame ceiling. cell_octant_size MUST equal TerrainWorld.ChunkSize (both 32) — locked invariant"
    referenced_by:
      - docs/architecture/adr-0002-terrain-data-model.md
    added: 2026-08-07
    revised: ""

  - system: terrain-data-model
    status: active
    budget_ms: 0
    adr: docs/architecture/adr-0002-terrain-data-model.md
    notes: "Memory: 2 MB cell data at MVP (128x128x16), 16 MB full-vision (256x256x32); chunks 8 KB, off the Large Object Heap by construction; render/video memory 14.25-16.42 MB for the 3-layer cutaway (measured)"
    referenced_by:
      - docs/architecture/adr-0002-terrain-data-model.md
    added: 2026-08-07
    revised: ""

  - system: all-simulation
    status: active
    budget_ms: 0
    adr: docs/architecture/adr-0002-terrain-data-model.md   # policy asserted jointly by ADR-0001/0002/0003; measured by the Tier 0 spikes
    notes: "ZERO steady-state allocation in the simulation path — a measured, enforceable standard (0.17 B/mutation, 0 Gen0 over 60k mutations; 0.00 B/sub-step over 20k sub-steps). Regressions are bugs. MutationWindow.Open() must return a readonly struct scope (a class scope boxes 24 B/dispatch)"
    referenced_by:
      - docs/architecture/adr-0001-time-authority-mode-switch.md
      - docs/architecture/adr-0003-entity-data-ownership.md
    added: 2026-08-07
    revised: ""

  - system: battle-checkpoint
    status: active
    budget_ms: 0.6
    adr: docs/architecture/adr-0004-battle-checkpoint-architecture.md
    notes: "Sim-thread cost per resolved activation: ~0.6 ms snapshot inside the post-resolution beat, zero steady-state allocation; gzip+write (~20-30 ms) on a background thread, never the sim thread; +~4 MB pooled buffers resident during battles. Gate: checkpoint cost never appears in the combat frame-time profile on target hardware — the shared promotion gate for ADR-0002 and ADR-0004"
    referenced_by:
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md
      - docs/architecture/adr-0002-terrain-data-model.md
    added: 2026-08-07
    revised: ""

