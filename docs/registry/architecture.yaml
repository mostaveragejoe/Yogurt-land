# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: random_number_generation
    status: active
    api: "PCG-XSH-RR 64/32, ported in Hollowdeep.Core, owned by SeededRngStore"
    not: "System.Random / Godot RandomNumberGenerator"   # explicitly banned for this purpose
    adr: docs/architecture/adr-0005-seeded-rng.md
    reason: "Version-stable across .NET/OS/CPU (System.Random is not a stable contract); state-based resume in O(1) at arbitrary draw counts; native per-stream sequence selector for independent streams; zero Godot dependency"
    referenced_by:
      - docs/architecture/adr-0005-seeded-rng.md
    added: 2026-08-08
    revised: ""

# Example:
#
# api_decisions:
