# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: gameplay_pause
    status: active
    api: "RealTimeAuthority at zero sub-steps (speed 0)"
    not: SceneTree.paused   # reserved for a possible future UI-pause layer; two competing pause mechanisms are forbidden
    adr: docs/architecture/adr-0001-time-authority-mode-switch.md
    reason: "Engine pause is a pause primitive, not a scheduler; gameplay pause must stay inside the authority model so raids, timers, and determinism behave"
    referenced_by:
      - docs/architecture/adr-0001-time-authority-mode-switch.md
    added: 2026-08-07
    revised: ""

  - purpose: game_speed
    status: active
    api: "Fixed-dt sub-stepping — speed multiplies the sub-step count N, dt constant (1/60 s)"
    not: delta-scaling   # banned: destroys fixed-step determinism and would have closed off post-battle time catch-up
    adr: docs/architecture/adr-0001-time-authority-mode-switch.md
    reason: "Determinism + the catch-up option; spike-proven: adding a speed touches zero ITickable implementations"
    referenced_by:
      - docs/architecture/adr-0001-time-authority-mode-switch.md
    added: 2026-08-07
    revised: ""

  - purpose: mutation_window_scope
    status: active
    api: "MutationWindow.Open() returns a depth-counted readonly struct scope"
    not: "IDisposable class scope"   # boxes 24 B on every dispatch — measured violation of the zero-allocation standard
    adr: docs/architecture/adr-0001-time-authority-mode-switch.md
    reason: "Spike Correction 1; `using` on a known struct type does not box; the allocation assertion belongs in CI"
    referenced_by:
      - docs/architecture/adr-0002-terrain-data-model.md
      - docs/architecture/adr-0003-entity-data-ownership.md
    added: 2026-08-07
    revised: ""

  - purpose: entity_identity
    status: active
    api: "EntityId(long Value), 0 = None; monotonic per world via a serialized EntityIdSource; NEVER reused; one id space across all kinds"
    not: "ulong ids, per-kind id spaces, id reuse/free-lists"
    adr: docs/architecture/adr-0003-entity-data-ownership.md
    reason: "long crosses the Godot C# Variant boundary without conversion; the serialized counter IS the non-reuse guarantee; dangling ids legally resolve to nothing"
    referenced_by:
      - docs/architecture/adr-0002-terrain-data-model.md   # shared primitives namespace
      - docs/architecture/adr-0003-entity-data-ownership.md
    added: 2026-08-07
    revised: ""

  - purpose: terrain_chunk_mapping
    status: active
    api: "TerrainWorld.ChunkOf() / TerrainWorld.ChunkSize — the only sanctioned CellCoord -> chunk mapping"
    not: "caller-side shift/mask constants"
    adr: docs/architecture/adr-0002-terrain-data-model.md
    reason: "Chunk size is a queryable tunable; hardcoded caller math breaks silently if it is ever retuned"
    referenced_by:
      - docs/architecture/adr-0002-terrain-data-model.md
    added: 2026-08-07
    revised: ""

  - purpose: terrain_render_backend
    status: active
    api: "Two stacked GridMaps (wall map + floor map) at cell_octant_size = 32, both pure write targets fed from TerrainWorld"
    not: "GridMap as authoritative store; MultiMesh (measured ~240x worse per-dig update, 2.6x more draw calls)"
    adr: docs/architecture/adr-0002-terrain-data-model.md
    reason: "Spike-measured 2026-07-25/26: 32 draw calls, ~2 us/dig, +2.17 MB video memory for the floor map; future per-cell visual layers = more stacked maps"
    referenced_by:
      - docs/architecture/adr-0002-terrain-data-model.md
    added: 2026-08-07
    revised: ""

  - purpose: simulation_rng
    status: active
    api: "Hand-rolled PCG32 XSH-RR 64/32 (Hollowdeep.Core.Random) — 16-byte PcgState {State, Increment}, increment-as-stream-selector (odd, RngSeeder-set only, Restore debug-asserts), SplitMix64 seeding over (MasterSeed, RngStreamId [, EncounterId]); core multiply-add step in an explicit unchecked block; NextFloat01 via a specified bit construction; NextInt via Lemire's method"
    not: "System.Random (seeded sequence not stable across .NET versions; state not restorable); Godot.RandomNumberGenerator (Godot dependency in core + no stream-selector primitive — fails two independent rules); xoshiro256** (2x state, jump-ahead coefficient risk unneeded at MVP scale); one global sequential stream (draw-order coupling — the exact failure mode systems-index #4 names)"
    adr: docs/architecture/adr-0005-seeded-rng-determinism.md
    reason: "Determinism must survive years of .NET upgrades; MasterSeed is the ONE external-entropy admission point in the game; AC-67's resumable-at-arbitrary-draw-counts reduces to serializing two named ulong fields; CI matches NextUInt32 against PCG32's published reference test vectors"
    referenced_by:
      - docs/architecture/adr-0005-seeded-rng-determinism.md
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md
    added: 2026-08-07
    revised: ""

  - purpose: checkpoint_file_io
    status: active
    api: ".NET System.IO + GZipStream on a background writer thread; gzip to a same-volume temp file, fsync, atomic rename/File.Replace over the slot"
    not: "Godot FileAccess; sim-thread writes; cross-volume temp files (rename atomicity silently breaks)"
    adr: docs/architecture/adr-0004-battle-checkpoint-architecture.md
    reason: "Plain-C# core has zero Godot references; the sim thread never blocks on disk; a kill at any instant leaves a valid old or new file. Save-directory path is resolved once at the Godot-side composition root and handed to the core as a string"
    referenced_by:
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md
    added: 2026-08-07
    revised: ""

  - purpose: save_ordering
    status: active
    api: "In-file monotonic stamp (TickSequence + save ordinal); newest-valid-save load across slots"
    not: filesystem-mtime   # fragile against clock changes and Steam Cloud restores
    adr: docs/architecture/adr-0004-battle-checkpoint-architecture.md
    reason: "mtime ordering is what would let a resurrected checkpoint outrank the battle-end save"
    referenced_by:
      - docs/architecture/adr-0004-battle-checkpoint-architecture.md
    added: 2026-08-07
    revised: ""

