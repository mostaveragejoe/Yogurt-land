# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: scene_tree_paused_in_simulation_path
    status: active
    description: "Gameplay pause is RealTimeAuthority at zero sub-steps; SceneTree.paused is reserved for a future UI-pause layer only."
    why: "Two competing pause mechanisms desync timers, raids, and determinism."
    adr: docs/architecture/adr-0001-time-authority-mode-switch.md
    added: 2026-08-07

  - pattern: simulation_logic_in_process_callbacks
    status: active
    description: "ITickable.Tick() is the only sanctioned simulation-update path; _Process/_PhysicsProcess are presentation-only."
    why: "Sim logic in Node callbacks is not headlessly testable, escapes the authority model, and entangles save state with the scene tree."
    adr: docs/architecture/adr-0001-time-authority-mode-switch.md
    added: 2026-08-07

  - pattern: delta_scaling_for_game_speed
    status: active
    description: "Speed multiplies the fixed-dt sub-step count; it never scales dt."
    why: "Delta-scaling breaks fixed-step determinism and closes off post-battle time catch-up."
    adr: docs/architecture/adr-0001-time-authority-mode-switch.md
    added: 2026-08-07

  - pattern: rng_outside_authority_execution
    status: active
    # revised 2026-08-07 (ADR-0005 companion, TD-ADR A5). Old description: "Random draws occur
    # only inside Tick() or authority-driven resolution — never in _Process, UI callbacks, or
    # event handlers." Old why ended: "Constrains the Seeded RNG ADR."
    description: "SIMULATION random draws occur only inside Tick(), authority-driven resolution, or the load window — never in _Process, UI callbacks, or event handlers. Governs the simulation streams in ADR-0005's ownership table only; PresentationRng (OS-seeded, never serialized, never drawn in Tick) is the sanctioned generator for views/audio/VFX noise and sits outside this rule by design."
    why: "Otherwise TickSequence guarantees nothing and same-seed replay/resume breaks. The load-window extension (mirroring ADR-0002 rule 5) sanctions the ColonistIdentity embark draw and future MapGeneration; RngStream.Next* debug-asserts the window."
    adr: docs/architecture/adr-0001-time-authority-mode-switch.md   # amended 2026-08-07; extension + scope defined in ADR-0005
    added: 2026-08-07
    revised: "2026-08-07"

  - pattern: state_advancing_bus_handlers
    status: active
    description: "World Change Event Bus handlers do idempotent bookkeeping only (invalidate, mark stale, dirty); ticking is the only channel that advances simulation state."
    why: "State-advancing handlers create hidden update ordering and break the paused-systems-still-receive-events rule."
    adr: docs/architecture/adr-0001-time-authority-mode-switch.md
    added: 2026-08-07

  - pattern: entity_state_in_switch_envelope
    status: active
    description: "SwitchTransitionData carries encounter framing only; any field duplicating Terrain or entity-store state is state conversion creeping back in."
    why: "Field creep rebuilds the rejected two-representations architecture one convenience field at a time."
    adr: docs/architecture/adr-0001-time-authority-mode-switch.md
    added: 2026-08-07

  - pattern: per_entity_sim_state_as_nodes
    status: active
    description: "Per-entity simulation state is plain data in typed stores; Godot Nodes are views that bind by EntityId and write nothing."
    why: "Entity state on Nodes kills headless testing, ties lifecycle to the scene tree, and compromises the save format."
    adr: docs/architecture/adr-0003-entity-data-ownership.md
    added: 2026-08-07

  - pattern: terrain_writes_outside_mutation_window
    status: active
    description: "TerrainWorld mutations happen only inside authority-driven execution or the load window — never from UI callbacks or bus handlers (debug-asserted; Publish-on-stack also asserted)."
    why: "One mechanism catches both forbidden write paths; without it the single-write-path guarantee is convention only."
    adr: docs/architecture/adr-0002-terrain-data-model.md
    added: 2026-08-07

  - pattern: cell_fields_beyond_architecture
    status: active
    description: "TerrainCell describes the architecture only; occupants, plans, zones, and combat state live with their firewall-table owners."
    why: "The God-object firewall — cell-struct field creep is the named growth risk for the highest-fan-out system."
    adr: docs/architecture/adr-0002-terrain-data-model.md
    added: 2026-08-07

  - pattern: retained_terrain_change_batch
    status: active
    description: "TerrainChangeBatch is pooled and valid only for the duration of Publish; handlers copy primitives out synchronously. The ref struct makes retention a compile error."
    why: "The buffer is reused on the next mutation; a retained batch is silent corruption."
    adr: docs/architecture/adr-0002-terrain-data-model.md
    added: 2026-08-07

  - pattern: gridmap_as_authoritative_terrain
    status: active
    description: "The terrain model is plain C#; GridMap (or any Node) is at most a render backend reading from it."
    why: "Node-held state breaks headless tests, the serialization contract, and the zero-conversion mode switch."
    adr: docs/architecture/adr-0002-terrain-data-model.md
    added: 2026-08-07

  - pattern: entity_writes_outside_writer_interfaces
    status: active
    description: "Store mutation exists only through per-(system x field group) writer interfaces granted at the composition root; every write debug-asserts window, mode (where authority-split), and id kind."
    why: "Runtime-only enforcement fails silently in unexercised paths; compile-time unrepresentability keeps the ownership table true."
    adr: docs/architecture/adr-0003-entity-data-ownership.md
    added: 2026-08-07

  - pattern: combat_transient_state_in_stores
    status: active
    description: "Anything meaningless outside an encounter (initiative, AP, target locks, overwatch) lives in encounter-scoped side tables, never in stores, never in a colony save; serialized only into the battle checkpoint by its owners."
    why: "Store leakage puts battle state in colony saves; the Battle Persistence carve-out is NOT licence to move encounter fields into stores."
    adr: docs/architecture/adr-0003-entity-data-ownership.md
    added: 2026-08-07

  - pattern: generic_misc_entity_store
    status: active
    description: "Every entity kind gets a typed store plus ownership-table rows; a kind without a table row cannot exist."
    why: "The anti-God-object guard for the entity layer — a misc store erases ownership."
    adr: docs/architecture/adr-0003-entity-data-ownership.md
    added: 2026-08-07

  - pattern: ui_or_views_writing_stores
    status: active
    description: "Views bind by EntityId and read-only poll Revision; input/UI submits designations and orders to owning systems, never direct writes."
    why: "UI writes bypass the ownership table and the mutation window at once."
    adr: docs/architecture/adr-0003-entity-data-ownership.md
    added: 2026-08-07

  - pattern: occupancy_updates_outside_store_internal
    status: active
    description: "UnitOccupancyIndex has a single write path — store-internal position/death handling, synchronous and atomic with the store write. No external writer exists."
    why: "A second writer is the occupancy-diverges-from-positions bug class."
    adr: docs/architecture/adr-0003-entity-data-ownership.md
    added: 2026-08-07

  - pattern: checkpoint_restore_via_request_switch
    status: active
    description: "Loading a battle checkpoint never routes through RequestSwitch; Restore reconstructs TurnBasedAuthority directly and fires ModeTransitioned with reason RestoredFromCheckpoint."
    why: "Routing through RequestSwitch re-fires the switch-in autosave (overwriting the checkpoint with pre-battle state) and re-runs placement normalization (teleporting units mid-battle)."
    adr: docs/architecture/adr-0004-battle-checkpoint-architecture.md
    added: 2026-08-07

  - pattern: save_ordering_by_mtime
    status: active
    description: "Save recency is decided by the in-file monotonic stamp, never by filesystem mtime."
    why: "Clock changes and Steam Cloud restores reorder mtime; a resurrected checkpoint could outrank the battle-end save."
    adr: docs/architecture/adr-0004-battle-checkpoint-architecture.md
    added: 2026-08-07

  - pattern: non_checkpoint_turnbased_saves
    status: active
    description: "A Mode == TurnBased save is valid iff authored by the battle-checkpoint writer (writer-id header, refused write-side); from any other writer it is corrupt by definition."
    why: "AC-68's mechanism — without write-side refusal, a forged combat save is byte-indistinguishable from a checkpoint."
    adr: docs/architecture/adr-0004-battle-checkpoint-architecture.md
    added: 2026-08-07

  - pattern: rng_rederivation_at_restore
    status: active
    description: "Checkpoint restore Restore()s combat streams from their serialized PcgState inside the load window (via ADR-0004's sanctioned restore writer); deriving from (MasterSeed, RngStreamId, EncounterId) happens at switch-in ONLY, never on the RestoredFromCheckpoint path."
    why: "Re-derivation resets both combat streams to draw count zero and silently falsifies AC-67's determinism-vs-unquit-control guarantee — the checkpoint's 16 bytes per stream ARE the mid-battle position (TD-ADR B1)."
    adr: docs/architecture/adr-0005-seeded-rng-determinism.md
    added: 2026-08-07

